{% extends "base.html" %}
{% block title %}Jelajahi · DramSi{% endblock %}

{% block content %}
<!-- ── Mobile: TikTok-style vertical feed ─────────────────────── -->
<div id="discoverFeed" class="md:hidden discover-feed">
  <!-- Item kartu di-render via JS -->
  <div id="feedTrack" class="discover-feed-track"></div>

  <!-- Top header floating -->
  <div class="pointer-events-none absolute inset-x-0 top-0 z-20 flex items-start gap-2 px-3 pt-[calc(env(safe-area-inset-top)+10px)] pb-3 bg-gradient-to-b from-black/55 to-transparent">
    <div class="pointer-events-auto flex items-center gap-2">
      <a href="/" aria-label="Kembali" class="grid h-10 w-10 place-items-center rounded-full bg-black/45 text-white backdrop-blur active:scale-90 transition">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </a>
    </div>
    <div class="pointer-events-auto ml-auto flex items-center gap-2">
      <button id="feedPlatformBtn"
              class="inline-flex h-10 items-center gap-1.5 rounded-full bg-black/45 px-3.5 text-[12.5px] font-semibold text-white backdrop-blur active:scale-95 transition">
        <i data-lucide="layers" class="h-3.5 w-3.5"></i>
        <span id="feedPlatformLabel">—</span>
        <i data-lucide="chevron-down" class="h-3.5 w-3.5 opacity-70"></i>
      </button>
    </div>
  </div>
</div>

<!-- ── Desktop: classic grid (lebih nyaman di layar lebar) ────── -->
<div class="hidden md:block">
  <div class="pt-2 pb-1">
    <h1 class="text-2xl font-extrabold tracking-tight font-display" data-i18n="discover.title">Jelajahi</h1>
    <p class="mt-1 text-sm text-white/55" data-i18n="discover.sub">Temukan drama dari semua platform.</p>
  </div>

  <nav id="platformTabs" aria-label="Pilih platform" class="no-scrollbar -mx-4 mt-4 flex gap-1 overflow-x-auto px-4"></nav>

  <section class="mt-3">
    <div id="discoverGrid" class="grid grid-cols-3 gap-3 sm:grid-cols-4 md:grid-cols-5 md:gap-4 lg:grid-cols-6"></div>
    <div class="mt-7 flex justify-center">
      <button id="loadMoreBtn" hidden
              class="inline-flex items-center gap-2 rounded-full border border-line bg-ink-700 px-5 py-2.5 text-sm font-semibold text-white/85 transition hover:border-primary/60 active:scale-95">
        <i data-lucide="chevron-down" class="h-4 w-4"></i>
        <span data-i18n="common.load_more">Muat Lebih Banyak</span>
      </button>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/discover.js') }}"></script>
{% endblock %}
